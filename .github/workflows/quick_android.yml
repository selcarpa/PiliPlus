name: Quick Android

# 简化版 Android 编译流程：只做「拉代码 → 装 Flutter → 出 arm64 APK」
# 用于快速验证改动，不做版本号/签名/多 ABI/SDK 补丁等发布相关工作。
on:
    workflow_dispatch:
        inputs:
            ref:
                description: "要构建的分支 / tag"
                required: false
                default: "main"
                type: string
            check:
                description: "同时运行 flutter analyze 与单元测试"
                required: false
                default: true
                type: boolean
            apk:
                description: "构建 APK（关闭则只跑 analyze/测试）"
                required: false
                default: true
                type: boolean

jobs:
    apk:
        name: Build APK
        if: ${{ inputs.apk }}
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0

            - name: Setup Java
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Apply SDK patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Write signing key
              run: |
                  if [ ! -z "${{ secrets.QUICK_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.QUICK_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.QUICK_KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.QUICK_KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.QUICK_KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Pub get
              run: flutter pub get

            - name: Build arm64 release APK
              run: >
                  flutter build apk --release
                  --target-platform android-arm64
                  --dart-define=pili.name=quick
                  --dart-define=pili.code=1
                  --dart-define=pili.hash=${{ github.sha }}
                  --dart-define=pili.time=0

            - name: Upload APK
              uses: actions/upload-artifact@v7
              with:
                  name: quick-apk
                  path: build/app/outputs/flutter-apk/app-release.apk
                  if-no-files-found: error

    check:
        name: Analyze & Test
        if: ${{ inputs.check }}
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.ref }}

            - name: Setup Flutter
              uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Install Linux build deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev

            - name: Apply SDK patch
              shell: pwsh
              run: lib/scripts/patch.ps1 android

            - name: Pub get
              run: flutter pub get

            - name: Analyze
              run: flutter analyze --no-fatal-warnings --no-fatal-infos

            - name: Unit test (orientation)
              run: flutter test test/utils/orientation_utils_test.dart

            - name: Unit test (all)
              run: flutter test
